[client]
showSidebarNavigation = false

[theme]
base = "dark"
font = "IBM Plex Sans Thai:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap"

[theme.dark]
primaryColor = "#8cd4c3"
backgroundColor = "#101419"
secondaryBackgroundColor = "#191f27"
textColor = "#edf1f7"
borderColor = "#35404e"
dataframeHeaderBackgroundColor = "#202933"
dataframeHeaderTextColor = "#edf1f7"
chartCategoricalColors = ["#8cd4c3", "#8bb8e8", "#dab68a", "#c4a3df"]

[theme.dark.sidebar]
backgroundColor = "#12171e"
secondaryBackgroundColor = "#191f27"

[theme.light]
primaryColor = "#126b5b"
backgroundColor = "#f5f6f8"
secondaryBackgroundColor = "#ffffff"
textColor = "#202b3a"
borderColor = "#ccd3dc"
dataframeHeaderBackgroundColor = "#edf3f1"
dataframeHeaderTextColor = "#202b3a"
chartCategoricalColors = ["#126b5b", "#32659b", "#956134", "#8058a0"]

[theme.light.sidebar]
backgroundColor = "#eff1f4"
secondaryBackgroundColor = "#ffffff"
