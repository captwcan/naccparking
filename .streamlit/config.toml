[client]
showSidebarNavigation = false

[theme]
base = "dark"
font = "IBM Plex Sans Thai:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap"

[theme.dark]
primaryColor = "#bda3ff"
backgroundColor = "#111015"
secondaryBackgroundColor = "#1d1b25"
textColor = "#f2eff8"
borderColor = "#4d455d"
dataframeHeaderBackgroundColor = "#2a2538"
dataframeHeaderTextColor = "#f2eff8"
chartCategoricalColors = ["#bda3ff", "#80b9db", "#d5ad86", "#8bd3b3"]

[theme.dark.sidebar]
backgroundColor = "#16141c"
secondaryBackgroundColor = "#1d1b25"

[theme.light]
primaryColor = "#7042b5"
backgroundColor = "#f5f2f9"
secondaryBackgroundColor = "#ffffff"
textColor = "#2b2436"
borderColor = "#b5aac5"
dataframeHeaderBackgroundColor = "#eee7f8"
dataframeHeaderTextColor = "#2b2436"
chartCategoricalColors = ["#7042b5", "#32659b", "#956134", "#257457"]

[theme.light.sidebar]
backgroundColor = "#eee9f4"
secondaryBackgroundColor = "#ffffff"
